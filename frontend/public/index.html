<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShirtPrint Co. Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #3f37c9;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --success: #4cc9f0;
            --warning: #f72585;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7ff;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h2 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-weight: 600;
            text-align: center;
            position: relative;
            padding-bottom: 0.5rem;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 65vh;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 1.5rem;
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chat-header i {
            font-size: 1.25rem;
        }

        .chat-header span {
            font-weight: 500;
        }

        .chat-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-color: #fafbff;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1.25rem;
            border-radius: 1rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease-out;
            font-size: 0.95rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .bot {
            align-self: flex-start;
            background: white;
            color: var(--dark);
            border-bottom-left-radius: 0.25rem;
            border: 1px solid #e9ecef;
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--gray);
            margin-top: 0.5rem;
            text-align: right;
            opacity: 0.8;
        }

        .input-area {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 0.75rem;
            padding: 1rem;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        #userInput {
            flex: 1;
            padding: 0.75rem 1.25rem;
            border: 2px solid #e9ecef;
            border-radius: 2rem;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        #userInput:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        #sendButton {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #sendButton:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        #sendButton:disabled {
            background: var(--gray);
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 0.75rem 1.25rem;
            background: white;
            border-radius: 1rem;
            border: 1px solid #e9ecef;
            width: fit-content;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--gray);
        }

        .typing-dots {
            display: inline-flex;
            gap: 0.25rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--gray);
            border-radius: 50%;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        .error-message {
            display: none;
            width: 100%;
            max-width: 800px;
            padding: 0.75rem 1.25rem;
            background-color: #fee;
            color: var(--warning);
            border-radius: 0.5rem;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            border: 1px solid rgba(247, 37, 133, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes typingAnimation {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
            30% { transform: translateY(-3px); opacity: 1; }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .chat-container {
                height: 70vh;
            }
            
            .message {
                max-width: 90%;
            }
            
            #sendButton {
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <h2>ShirtPrint Co. Assistant</h2>
    <div class="chat-container">
        <div class="chat-header">
            <i class="fas fa-tshirt"></i>
            <span>Printing Assistant</span>
            <div style="flex: 1"></div>
            <span class="badge">Online</span>
        </div>
        <div id="chat" class="chat-body">
            <div class="message bot">
                <strong>Welcome to ShirtPrint Co. in Kochi!</strong> I can help you with:
                <ul style="margin-top: 0.5rem; padding-left: 1.25rem;">
                    <li>Custom shirt pricing (starting at ₹199)</li>
                    <li>Design guidelines and file requirements</li>
                    <li>Our 10-day return policy</li>
                    <li>Bulk order discounts</li>
                </ul>
                <div class="message-time">Just now</div>
            </div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask about shirts, pricing, or designs..." autocomplete="off" />
        <button id="sendButton">
            <i class="fas fa-paper-plane"></i>
            <span>Send</span>
        </button>
    </div>
    <div id="typingIndicator" class="typing-indicator">
        <span>Assistant is typing</span>
        <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
    </div>
    <div id="errorMessage" class="error-message"></div>
    <script src="script.js"></script>
</body>
</html>
